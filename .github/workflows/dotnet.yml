name: .NET build and CLI smoke tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke:
    name: Build and smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore InterviewFingerprint.slnx
      - name: Build
        run: dotnet build InterviewFingerprint.slnx --configuration Release --no-restore
      - name: Publish CLI for deployment smoke testing
        run: dotnet publish src/InterviewFingerprint/InterviewFingerprint.csproj --configuration Release --no-restore --output artifacts/publish
      - name: Run published CLI smoke tests and synthetic watermark diagnostics
        run: dotnet run --project tests/InterviewFingerprint.SmokeTests --configuration Release --no-build -- artifacts/publish/InterviewFingerprint.dll --report artifacts/watermark-robustness.json
      - name: Upload watermark diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watermark-robustness-${{ matrix.os }}
          path: artifacts/watermark-robustness.json
          if-no-files-found: warn
